<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
{{alternates}}
<meta name="theme-color" content="#f6f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1211" media="(prefers-color-scheme: dark)">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Chaos Engineering">
<meta property="og:title" content="{{og_title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:image" content="{{base}}/img/og.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="{{og_locale}}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="{{root}}/favicon.ico" sizes="any">
<link rel="icon" href="{{root}}/img/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="{{root}}/img/apple-touch-icon.png">
<link rel="preload" href="{{root}}/fonts/inter.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{root}}/fonts/space-grotesk.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{root}}/css/site.css?v={{version}}">
<script>document.documentElement.classList.add("js")</script>
{{jsonld}}
</head>
<body class="{{page_class}}">
<a class="skip" href="#main">{{t_skip}}</a>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="{{home_url}}"><img src="{{root}}/img/logo-96.png" alt="" width="34" height="34">Chaos Engineering</a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="nav" aria-label="{{t_menu}}">
      <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6h14M3 10h14M3 14h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
    <nav class="nav" id="nav" aria-label="{{t_nav}}">
{{nav}}
    </nav>
  </div>
</header>
<main id="main">
{{content}}
</main>
<footer class="site-footer">
  <div class="wrap">
    <div>
      <a class="brand" href="{{home_url}}"><img src="{{root}}/img/logo-96.png" alt="" width="34" height="34">Chaos Engineering</a>
      <p>{{t_tagline}}</p>
      <p><a href="mailto:contact@chaos-eng.com">contact@chaos-eng.com</a></p>
    </div>
    <div>
      <p class="footer-title">{{t_site}}</p>
      <ul>
{{footer_nav}}
      </ul>
    </div>
    <div>
      <p class="footer-title">{{t_info}}</p>
      <ul>
        <li><a href="{{legal_url}}">{{t_legal}}</a></li>
        <li><a href="https://www.linkedin.com/in/justindirrenberger/" rel="noopener">LinkedIn</a></li>
        <li><a href="{{alt_url}}" hreflang="{{alt_lang}}" lang="{{alt_lang}}">{{alt_name}}</a></li>
      </ul>
    </div>
    <p class="fine">&copy; {{year}} Chaos Engineering. {{t_rights}}</p>
  </div>
</footer>
<script>
(function () {
  var b = document.querySelector(".menu-toggle"), n = document.getElementById("nav");
  if (!b || !n) return;
  b.addEventListener("click", function () {
    var o = n.classList.toggle("open");
    b.setAttribute("aria-expanded", o ? "true" : "false");
  });
  n.addEventListener("click", function (e) {
    if (e.target.closest("a")) { n.classList.remove("open"); b.setAttribute("aria-expanded", "false"); }
  });
})();
</script>
</body>
</html>
